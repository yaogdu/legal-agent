<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1140" viewBox="0 0 1780 1140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f6f9fc"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:38px;font-weight:800;fill:#0f172a;letter-spacing:0}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;fill:#64748b}
      .section{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px;font-weight:800;fill:#0f172a}
      .node-title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px;font-weight:800;fill:#0f172a}
      .node-cn{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:13px;fill:#475569}
      .small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:12px;fill:#64748b}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:11px;fill:#64748b}
      .pill{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:800;fill:#0f172a}
      .white-title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:22px;font-weight:800;fill:#ffffff}
      .white-cn{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:13px;fill:#d1fae5}
      .panel{fill:#ffffff;stroke:#d8e1ec;stroke-width:1.4;rx:28;filter:url(#shadow)}
      .box{fill:url(#green);stroke:#cbd5e1;stroke-width:1.25;rx:18}
      .store{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3;rx:18}
      .line{stroke:#475569;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
      .softline{stroke:#94a3b8;stroke-width:1.7;fill:none;marker-end:url(#arrow);stroke-dasharray:5 7}
    </style>
  </defs>

  <rect width="1780" height="1140" fill="url(#bg)"/>

  <text x="80" y="76" class="title">Legal Agent Runtime Governance</text>
  <text x="82" y="108" class="subtitle">把法律 Agent 从 demo 变成生产系统：调度、状态、工具治理、审批、沙箱、审计、评测</text>

  <rect x="1190" y="48" width="500" height="72" rx="18" fill="#ffffff" stroke="#d8e1ec" filter="url(#shadow)"/>
  <text x="1218" y="79" class="pill">Core Message</text>
  <text x="1218" y="103" class="small">Runtime controls execution; model only decides bounded semantic steps</text>

  <!-- request and scheduling -->
  <rect x="80" y="160" width="1620" height="220" rx="30" class="panel"/>
  <text x="112" y="202" class="section">Scheduling &amp; Execution Plane</text>
  <text x="112" y="226" class="small">高并发下不能同步阻塞跑 Agent，需要队列、worker、租户隔离和资源治理</text>

  <g transform="translate(140 262)">
    <rect class="box" x="0" y="0" width="170" height="74"/>
    <text x="28" y="31" class="node-title">API Gateway</text>
    <text x="28" y="56" class="node-cn">鉴权 / 限流 / 租户</text>
  </g>
  <path class="line" d="M310 299 L360 299"/>
  <g transform="translate(368 262)">
    <rect class="box" x="0" y="0" width="170" height="74"/>
    <text x="28" y="31" class="node-title">Task Queue</text>
    <text x="28" y="56" class="node-cn">削峰 / 延迟 / 重试</text>
  </g>
  <path class="line" d="M538 299 L588 299"/>
  <g transform="translate(596 262)">
    <rect class="box" x="0" y="0" width="170" height="74"/>
    <text x="28" y="31" class="node-title">Scheduler</text>
    <text x="28" y="56" class="node-cn">优先级 / 配额 / 路由</text>
  </g>
  <path class="line" d="M766 299 L816 299"/>
  <g transform="translate(824 238)">
    <rect x="0" y="0" width="275" height="122" rx="22" fill="url(#dark)" stroke="#0f766e"/>
    <text x="28" y="40" class="white-title">Worker Pool</text>
    <text x="28" y="70" class="white-cn">Legal Agent runtime workers</text>
    <text x="28" y="96" class="white-cn">Python / Go services · autoscaling</text>
  </g>
  <path class="line" d="M1099 299 L1149 299"/>
  <g transform="translate(1158 262)">
    <rect class="box" x="0" y="0" width="180" height="74"/>
    <text x="28" y="31" class="node-title">Model Router</text>
    <text x="28" y="56" class="node-cn">模型选择 / 成本控制</text>
  </g>
  <path class="line" d="M1338 299 L1388 299"/>
  <g transform="translate(1396 262)">
    <rect class="box" x="0" y="0" width="210" height="74"/>
    <text x="28" y="31" class="node-title">Tool Gateway</text>
    <text x="28" y="56" class="node-cn">MCP / Function Calling</text>
  </g>

  <!-- runtime contract -->
  <rect x="80" y="430" width="790" height="430" rx="30" class="panel"/>
  <text x="112" y="472" class="section">Durable Runtime Contract</text>
  <text x="112" y="496" class="small">每个 Agent Run 都要有可恢复的执行语义</text>

  <g transform="translate(120 535)">
    <rect class="store" x="0" y="0" width="220" height="78"/>
    <text x="28" y="33" class="node-title">Run State</text>
    <text x="28" y="58" class="node-cn">messages / plan / status</text>
  </g>
  <g transform="translate(380 535)">
    <rect class="store" x="0" y="0" width="220" height="78"/>
    <text x="28" y="33" class="node-title">Checkpoint</text>
    <text x="28" y="58" class="node-cn">暂停 / 恢复 / 回放</text>
  </g>
  <g transform="translate(640 535)">
    <rect class="store" x="0" y="0" width="180" height="78"/>
    <text x="28" y="33" class="node-title">Lease</text>
    <text x="28" y="58" class="node-cn">worker 持有任务</text>
  </g>

  <g transform="translate(120 650)">
    <rect class="store" x="0" y="0" width="220" height="78"/>
    <text x="28" y="33" class="node-title">Idempotency</text>
    <text x="28" y="58" class="node-cn">防止重复副作用</text>
  </g>
  <g transform="translate(380 650)">
    <rect class="store" x="0" y="0" width="220" height="78"/>
    <text x="28" y="33" class="node-title">Fencing Token</text>
    <text x="28" y="58" class="node-cn">防止旧 worker 写回</text>
  </g>
  <g transform="translate(640 650)">
    <rect class="store" x="0" y="0" width="180" height="78"/>
    <text x="28" y="33" class="node-title">Cancel</text>
    <text x="28" y="58" class="node-cn">超时 / 用户取消</text>
  </g>

  <g transform="translate(120 765)">
    <rect x="0" y="0" width="700" height="54" rx="18" fill="#fefce8" stroke="#fde68a"/>
    <text x="28" y="34" class="pill">Failure semantics</text>
    <text x="160" y="34" class="small">worker crash 后从 checkpoint 恢复；tool side effect 依赖 idempotency key 去重</text>
  </g>

  <!-- governance -->
  <rect x="910" y="430" width="790" height="430" rx="30" class="panel"/>
  <text x="942" y="472" class="section">Governance &amp; Safety Plane</text>
  <text x="942" y="496" class="small">法律场景高风险，必须把工具、输出和数据访问纳入治理</text>

  <g transform="translate(950 535)">
    <rect class="store" x="0" y="0" width="210" height="78"/>
    <text x="28" y="33" class="node-title">Policy Engine</text>
    <text x="28" y="58" class="node-cn">规则 / 语义 / 风险分级</text>
  </g>
  <g transform="translate(1195 535)">
    <rect class="store" x="0" y="0" width="210" height="78"/>
    <text x="28" y="33" class="node-title">Approval</text>
    <text x="28" y="58" class="node-cn">人工确认高风险动作</text>
  </g>
  <g transform="translate(1440 535)">
    <rect class="store" x="0" y="0" width="210" height="78"/>
    <text x="28" y="33" class="node-title">Sandbox</text>
    <text x="28" y="58" class="node-cn">工具执行隔离</text>
  </g>

  <g transform="translate(950 650)">
    <rect class="store" x="0" y="0" width="210" height="78"/>
    <text x="28" y="33" class="node-title">Audit Trail</text>
    <text x="28" y="58" class="node-cn">输入 / 工具 / 输出可追溯</text>
  </g>
  <g transform="translate(1195 650)">
    <rect class="store" x="0" y="0" width="210" height="78"/>
    <text x="28" y="33" class="node-title">Data Guard</text>
    <text x="28" y="58" class="node-cn">租户 / 权限 / 脱敏</text>
  </g>
  <g transform="translate(1440 650)">
    <rect class="store" x="0" y="0" width="210" height="78"/>
    <text x="28" y="33" class="node-title">Risk Tier</text>
    <text x="28" y="58" class="node-cn">L0-L5 动作等级</text>
  </g>

  <g transform="translate(950 765)">
    <rect x="0" y="0" width="700" height="54" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="28" y="34" class="pill">Legal guardrails</text>
    <text x="160" y="34" class="small">无证据结论、越权检索、自动提交法律文件等都需要策略判断</text>
  </g>

  <!-- observability and evaluation -->
  <rect x="80" y="910" width="1620" height="170" rx="30" class="panel"/>
  <text x="112" y="952" class="section">Observability &amp; Evaluation</text>
  <text x="112" y="976" class="small">上线后要能知道 Agent 为什么失败、哪里慢、哪个工具不稳定、质量有没有回退</text>

  <g transform="translate(210 1000)">
    <rect class="box" x="0" y="0" width="190" height="52"/>
    <text x="28" y="32" class="pill">Trace</text>
    <text x="85" y="32" class="small">执行轨迹</text>
  </g>
  <g transform="translate(435 1000)">
    <rect class="box" x="0" y="0" width="190" height="52"/>
    <text x="28" y="32" class="pill">Metrics</text>
    <text x="105" y="32" class="small">延迟 / 成本</text>
  </g>
  <g transform="translate(660 1000)">
    <rect class="box" x="0" y="0" width="190" height="52"/>
    <text x="28" y="32" class="pill">Logs</text>
    <text x="82" y="32" class="small">异常 / 工具错误</text>
  </g>
  <g transform="translate(885 1000)">
    <rect class="box" x="0" y="0" width="190" height="52"/>
    <text x="28" y="32" class="pill">Eval Set</text>
    <text x="105" y="32" class="small">准入样本</text>
  </g>
  <g transform="translate(1110 1000)">
    <rect class="box" x="0" y="0" width="190" height="52"/>
    <text x="28" y="32" class="pill">Regression</text>
    <text x="130" y="32" class="small">回归评测</text>
  </g>
  <g transform="translate(1335 1000)">
    <rect class="box" x="0" y="0" width="190" height="52"/>
    <text x="28" y="32" class="pill">Red Team</text>
    <text x="128" y="32" class="small">攻防测试</text>
  </g>

  <path class="softline" d="M960 360 C870 410, 780 420, 720 535"/>
  <path class="softline" d="M1510 336 C1510 405, 1518 470, 1545 535"/>
  <path class="softline" d="M1030 728 C1030 835, 550 880, 310 1000"/>
  <path class="softline" d="M1545 728 C1545 835, 1388 900, 1430 1000"/>
</svg>
