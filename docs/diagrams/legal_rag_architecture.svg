<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1120" viewBox="0 0 1750 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f6f9fc"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:38px;font-weight:800;fill:#0f172a;letter-spacing:0}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;fill:#64748b}
      .section{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px;font-weight:800;fill:#0f172a}
      .node-title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px;font-weight:800;fill:#0f172a}
      .node-cn{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:13px;fill:#475569}
      .small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:12px;fill:#64748b}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:11px;fill:#64748b}
      .pill{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:800;fill:#0f172a}
      .white-title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:22px;font-weight:800;fill:#ffffff}
      .white-cn{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:13px;fill:#d1fae5}
      .panel{fill:#ffffff;stroke:#d8e1ec;stroke-width:1.4;rx:28;filter:url(#shadow)}
      .box{fill:url(#green);stroke:#cbd5e1;stroke-width:1.25;rx:18}
      .store{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3;rx:18}
      .line{stroke:#475569;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
      .softline{stroke:#94a3b8;stroke-width:1.7;fill:none;marker-end:url(#arrow);stroke-dasharray:5 7}
    </style>
  </defs>

  <rect width="1750" height="1120" fill="url(#bg)"/>

  <text x="80" y="76" class="title">Legal RAG Architecture</text>
  <text x="82" y="108" class="subtitle">法律 RAG 的关键不是“向量库”，而是证据可召回、引用可定位、结论可校验</text>

  <rect x="1180" y="48" width="490" height="72" rx="18" fill="#ffffff" stroke="#d8e1ec" filter="url(#shadow)"/>
  <text x="1208" y="79" class="pill">Core Message</text>
  <text x="1208" y="103" class="small">Hybrid retrieval + rerank + citation grounding + verification</text>

  <!-- Offline indexing -->
  <rect x="80" y="160" width="1590" height="370" rx="30" class="panel"/>
  <text x="112" y="202" class="section">Offline Indexing Pipeline</text>
  <text x="112" y="226" class="small">离线构建知识索引：原始资料先治理，再进入检索系统</text>

  <g transform="translate(120 270)">
    <rect class="box" x="0" y="0" width="210" height="170"/>
    <text x="28" y="38" class="node-title">Legal Sources</text>
    <text x="28" y="66" class="node-cn">法规 / 案例 / 模板 / 案卷</text>
    <text x="28" y="100" class="small">Law &amp; regulation</text>
    <text x="28" y="123" class="small">Judicial cases</text>
    <text x="28" y="146" class="small">Contracts / pleadings</text>
  </g>
  <path class="line" d="M330 355 L382 355"/>
  <g transform="translate(390 270)">
    <rect class="box" x="0" y="0" width="210" height="170"/>
    <text x="28" y="38" class="node-title">Parse &amp; Clean</text>
    <text x="28" y="66" class="node-cn">解析 / 去噪 / 标准化</text>
    <text x="28" y="100" class="small">OCR / layout</text>
    <text x="28" y="123" class="small">dedup / version</text>
    <text x="28" y="146" class="small">source metadata</text>
  </g>
  <path class="line" d="M600 355 L652 355"/>
  <g transform="translate(660 270)">
    <rect class="box" x="0" y="0" width="210" height="170"/>
    <text x="28" y="38" class="node-title">Legal Chunking</text>
    <text x="28" y="66" class="node-cn">法律语义切分</text>
    <text x="28" y="100" class="small">article / clause</text>
    <text x="28" y="123" class="small">case facts / reasoning</text>
    <text x="28" y="146" class="small">paragraph anchors</text>
  </g>
  <path class="line" d="M870 355 L922 355"/>
  <g transform="translate(930 270)">
    <rect class="box" x="0" y="0" width="210" height="170"/>
    <text x="28" y="38" class="node-title">Enrich</text>
    <text x="28" y="66" class="node-cn">结构化打标</text>
    <text x="28" y="100" class="small">jurisdiction / court</text>
    <text x="28" y="123" class="small">cause of action</text>
    <text x="28" y="146" class="small">validity / timeline</text>
  </g>
  <path class="line" d="M1140 355 L1192 355"/>
  <g transform="translate(1200 270)">
    <rect class="box" x="0" y="0" width="210" height="170"/>
    <text x="28" y="38" class="node-title">Embed &amp; Index</text>
    <text x="28" y="66" class="node-cn">向量化与索引</text>
    <text x="28" y="100" class="small">embedding</text>
    <text x="28" y="123" class="small">BM25 inverted index</text>
    <text x="28" y="146" class="small">citation anchor</text>
  </g>
  <path class="line" d="M1410 355 L1462 355"/>
  <g transform="translate(1470 270)">
    <rect x="0" y="0" width="150" height="170" rx="20" fill="url(#dark)" stroke="#0f766e"/>
    <text x="28" y="42" class="white-title">Stores</text>
    <text x="28" y="75" class="white-cn">Vector DB</text>
    <text x="28" y="100" class="white-cn">Search Index</text>
    <text x="28" y="125" class="white-cn">Doc Store</text>
    <text x="28" y="150" class="white-cn">Metadata DB</text>
  </g>

  <!-- Online retrieval -->
  <rect x="80" y="585" width="1590" height="430" rx="30" class="panel"/>
  <text x="112" y="627" class="section">Online Retrieval &amp; Grounded Generation</text>
  <text x="112" y="651" class="small">在线查询链路：先理解任务，再召回证据，最后基于证据生成和校验</text>

  <g transform="translate(120 705)">
    <rect class="box" x="0" y="0" width="190" height="150"/>
    <text x="28" y="38" class="node-title">Query Understanding</text>
    <text x="28" y="66" class="node-cn">查询理解</text>
    <text x="28" y="100" class="small">intent</text>
    <text x="28" y="123" class="small">entities / facts</text>
  </g>
  <path class="line" d="M310 780 L362 780"/>
  <g transform="translate(370 705)">
    <rect class="box" x="0" y="0" width="210" height="150"/>
    <text x="28" y="38" class="node-title">Hybrid Recall</text>
    <text x="28" y="66" class="node-cn">混合召回</text>
    <text x="28" y="100" class="small">Vector search</text>
    <text x="28" y="123" class="small">BM25 / filters</text>
  </g>
  <path class="line" d="M580 780 L632 780"/>
  <g transform="translate(640 705)">
    <rect class="box" x="0" y="0" width="190" height="150"/>
    <text x="28" y="38" class="node-title">Rerank</text>
    <text x="28" y="66" class="node-cn">相关性重排</text>
    <text x="28" y="100" class="small">cross-encoder</text>
    <text x="28" y="123" class="small">legal relevance</text>
  </g>
  <path class="line" d="M830 780 L882 780"/>
  <g transform="translate(890 705)">
    <rect class="box" x="0" y="0" width="210" height="150"/>
    <text x="28" y="38" class="node-title">Evidence Pack</text>
    <text x="28" y="66" class="node-cn">证据包组装</text>
    <text x="28" y="100" class="small">source / quote / anchor</text>
    <text x="28" y="123" class="small">score / freshness</text>
  </g>
  <path class="line" d="M1100 780 L1152 780"/>
  <g transform="translate(1160 705)">
    <rect x="0" y="0" width="210" height="150" rx="18" fill="url(#dark)" stroke="#0f766e"/>
    <text x="28" y="42" class="white-title">Grounded LLM</text>
    <text x="28" y="72" class="white-cn">基于证据生成</text>
    <text x="28" y="105" class="white-cn">answer with citations</text>
    <text x="28" y="130" class="white-cn">no source, no claim</text>
  </g>
  <path class="line" d="M1370 780 L1422 780"/>
  <g transform="translate(1430 705)">
    <rect class="box" x="0" y="0" width="190" height="150"/>
    <text x="28" y="38" class="node-title">Verify</text>
    <text x="28" y="66" class="node-cn">引用与事实校验</text>
    <text x="28" y="100" class="small">citation exists</text>
    <text x="28" y="123" class="small">claim supported</text>
  </g>

  <!-- Store detail cards -->
  <g transform="translate(370 895)">
    <rect class="store" x="0" y="0" width="250" height="72"/>
    <text x="24" y="31" class="pill">Vector DB</text>
    <text x="24" y="55" class="small">semantic recall · Milvus / pgvector / ES vector</text>
  </g>
  <g transform="translate(650 895)">
    <rect class="store" x="0" y="0" width="250" height="72"/>
    <text x="24" y="31" class="pill">Keyword Index</text>
    <text x="24" y="55" class="small">exact terms · BM25 · legal article names</text>
  </g>
  <g transform="translate(930 895)">
    <rect class="store" x="0" y="0" width="250" height="72"/>
    <text x="24" y="31" class="pill">Document Store</text>
    <text x="24" y="55" class="small">original text · page · paragraph · anchor</text>
  </g>
  <g transform="translate(1210 895)">
    <rect class="store" x="0" y="0" width="250" height="72"/>
    <text x="24" y="31" class="pill">Metadata DB</text>
    <text x="24" y="55" class="small">court · time · validity · tenant ACL</text>
  </g>

  <path class="softline" d="M470 855 C470 878, 480 885, 495 895"/>
  <path class="softline" d="M475 855 C555 875, 680 878, 775 895"/>
  <path class="softline" d="M995 855 C1000 875, 1025 884, 1050 895"/>
  <path class="softline" d="M995 855 C1090 875, 1230 878, 1335 895"/>

  <!-- bottom principles -->
  <rect x="80" y="1040" width="1590" height="44" rx="18" fill="#0f172a"/>
  <text x="112" y="1068" class="white-title" font-size="16">Quality Principles</text>
  <text x="310" y="1068" class="white-cn">高召回优先 · 混合检索 · 重排过滤 · 引用定位 · 权限过滤 · 证据不足则拒答或转人工</text>
</svg>
