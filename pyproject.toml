[project]
name = "legal-agent"
version = "0.1.0"
description = "Distributed legal agent demo with FastAPI, Temporal, AgentLedger, and pgvector RAG."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "temporalio>=1.8.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "langfuse>=2.50.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "agentledger-runtime[postgres]==1.3.4",
  "agentledger-inspector==1.3.4",
]

[project.scripts]
legal-agent = "legal_agent.cli.main:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legal_agent = ["document_templates/templates/*.md", "web/*"]
